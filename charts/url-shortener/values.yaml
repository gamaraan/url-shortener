# url-shortener Helm chart values.
# Populated in Phase 6 per development.md. Postgres credential VALUES are
# NEVER committed here; they are supplied at deploy time from GitHub secrets
# (CI) or from charts/url-shortener/.env (manual deploy, gitignored). See
# development.md §6.

# Target namespace for the app.
namespace: tinyurl

backend:
  image:
    repository: ghcr.io/gamaraan/url-shortener/backend
    tag: "2026.08.07-402d945a"
  replicas: 1
  listenAddr: ":8080"
  retentionPeriod: "3650d"
  cleanupFrequency: "60m"
  shortcodeLength: 7
  logLevel: "info"
  rateLimits: "100/1m"
  shutdownTimeout: "30s"
  preStopSleep: 10
  terminationGracePeriodSeconds: 45
  sqlitePath: "/data/url-shortener.db"
  # Optional PVC for SQLite persistence (only useful when postgres.enabled is false).
  persistence:
    enabled: false
    size: "1Gi"
    storageClassName: ""

frontend:
  image:
    repository: ghcr.io/gamaraan/url-shortener/frontend
    tag: "2026.08.07-402d945a"
  replicas: 1
  listenAddr: ":8080"
  backendURL: "http://backend:8080"
  logLevel: "info"
  shutdownTimeout: "30s"
  preStopSleep: 10
  terminationGracePeriodSeconds: 45

postgres:
  # When true, the chart creates a Secret with the credentials below and
  # injects DATABASE_URL into the backend. When false, the backend falls
  # back to a local SQLite file (single instance only).
  enabled: true
  # External Postgres in the db namespace (service postgres, ClusterIP).
  host: "postgres.db.svc.cluster.local" # POSTGRES_HOST (cross-namespace FQDN: <service>.<namespace>.svc.cluster.local)
  port: "5432" # POSTGRES_PORT
  database: "urlshortener" # POSTGRES_DB
  # Credential VALUES are supplied at deploy time from GitHub secrets (CI) or
  # charts/url-shortener/.env (manual); they are never committed here.
  user: "" # POSTGRES_USER
  password: "" # POSTGRES_PASSWORD
  # Optional full libpq URL; overrides the composed POSTGRES_* form.
  url: "" # DATABASE_URL

ingress:
  enabled: true
  className: "nginx"
  host: "tinyurl.gamara.ro"
  tls:
    enabled: true
    clusterIssuer: "letsencrypt-prod"

resources:
  backend:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "250m", memory: "128Mi" }
  frontend:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "250m", memory: "128Mi" }
