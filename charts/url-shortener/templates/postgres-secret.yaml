# pi-lens-ignore: YAML:0 — Helm templates are not raw YAML; they render to valid YAML (verified via helm template).
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "postgres.databaseURL" . | quote }}
{{- end }}